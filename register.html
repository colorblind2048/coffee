<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>注册 · Bean & Mood</title><link rel="stylesheet" href="style.css"/></head><body class="auth-page"><main class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">☕</span><span>BEAN & MOOD</span></a><h1>创建你的档案</h1><p class="auth-subtitle">记录每一次风味探索</p><form id="registerForm"><label>昵称<input type="text" id="registerName" placeholder="你的咖啡昵称" required/></label><label>邮箱<input type="email" id="registerEmail" placeholder="you@example.com" required/></label><label>密码<input type="password" id="registerPassword" placeholder="至少 6 位密码" minlength="6" required/></label><button class="primary-btn" type="submit">注册 <span>→</span></button></form><p class="switch-auth">已有账号？ <a href="login.html">去登录</a></p><p id="authMessage" class="auth-message"></p></main><script src="auth.js"></script></body></html>
