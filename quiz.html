<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>风味测试 · Bean & Mood</title><link rel="stylesheet" href="style.css"/></head>
<body class="quiz-page"><header class="site-header container"><a class="brand" href="index.html"><span class="brand-mark">☕</span><span>BEAN & MOOD</span></a><a class="close-link" href="index.html">退出测试 ×</a></header>
<main class="quiz-shell container"><div class="progress-row"><span id="stepLabel">01 / 08</span><div class="progress-track"><div id="progressBar"></div></div><span>风味探索</span></div><form id="quizForm"><section class="question-card active"><p class="question-kicker">LET'S START WITH THE BASICS</p><h1>你通常在什么时候<br/>想喝一杯咖啡？</h1><div class="options"><label><input type="radio" name="q1" value="morning" required/><span><b>☀</b> 清晨唤醒自己</span></label><label><input type="radio" name="q1" value="work"/><span><b>⌁</b> 工作 / 学习间隙</span></label><label><input type="radio" name="q1" value="afternoon"/><span><b>◒</b> 午后享受时光</span></label><label><input type="radio" name="q1" value="night"/><span><b>☾</b> 深夜灵感陪伴</span></label></div></section>
<section class="question-card"><p class="question-kicker">TASTE PROFILE</p><h1>哪一种风味最让你<br/>心动？</h1><div class="options"><label><input type="radio" name="q2" value="fruity"/><span><b>✿</b> 明亮果香，酸甜清新</span></label><label><input type="radio" name="q2" value="nutty"/><span><b>◈</b> 坚果焦糖，醇厚温暖</span></label><label><input type="radio" name="q2" value="floral"/><span><b>❋</b> 花香茶感，优雅细腻</span></label><label><input type="radio" name="q2" value="chocolate"/><span><b>●</b> 黑巧克力，浓郁回甘</span></label></div></section>
<section class="question-card"><p class="question-kicker">YOUR PERFECT CUP</p><h1>你更偏爱哪种<br/>口感？</h1><div class="options"><label><input type="radio" name="q3" value="light"/><span><b>≈</b> 轻盈顺滑</span></label><label><input type="radio" name="q3" value="creamy"/><span><b>◌</b> 奶油般柔和</span></label><label><input type="radio" name="q3" value="bold"/><span><b>◆</b> 厚重饱满</span></label><label><input type="radio" name="q3" value="clean"/><span><b>＋</b> 干净利落</span></label></div></section>
<section class="question-card"><p class="question-kicker">A LITTLE RITUAL</p><h1>你的咖啡通常<br/>怎么喝？</h1><div class="options"><label><input type="radio" name="q4" value="black"/><span><b>◉</b> 黑咖啡，纯粹到底</span></label><label><input type="radio" name="q4" value="milk"/><span><b>☁</b> 加奶，温柔平衡</span></label><label><input type="radio" name="q4" value="sweet"/><span><b>✦</b> 加糖或风味糖浆</span></label><label><input type="radio" name="q4" value="iced"/><span><b>◇</b> 冰的，清爽优先</span></label></div></section>
<section class="question-card"><p class="question-kicker">SLOW DOWN</p><h1>理想的喝咖啡场景是？</h1><div class="options"><label><input type="radio" name="q5" value="alone"/><span><b>◒</b> 一个人安静发呆</span></label><label><input type="radio" name="q5" value="friends"/><span><b>♧</b> 和朋友聊天</span></label><label><input type="radio" name="q5" value="book"/><span><b>▤</b> 看书或听音乐</span></label><label><input type="radio" name="q5" value="outdoor"/><span><b>⌂</b> 在户外晒太阳</span></label></div></section>
<section class="question-card"><p class="question-kicker">TRY SOMETHING NEW</p><h1>面对咖啡菜单，<br/>你会怎么选？</h1><div class="options"><label><input type="radio" name="q6" value="familiar"/><span><b>✓</b> 点熟悉的，不踩雷</span></label><label><input type="radio" name="q6" value="recommend"/><span><b>♡</b> 听朋友推荐</span></label><label><input type="radio" name="q6" value="new"/><span><b>✧</b> 挑最特别的那杯</span></label><label><input type="radio" name="q6" value="seasonal"/><span><b>❋</b> 看当季限定</span></label></div></section>
<section class="question-card"><p class="question-kicker">COFFEE MOOD</p><h1>用一个词形容<br/>你的咖啡时刻？</h1><div class="options"><label><input type="radio" name="q7" value="energy"/><span><b>↗</b> 元气</span></label><label><input type="radio" name="q7" value="comfort"/><span><b>♡</b> 治愈</span></label><label><input type="radio" name="q7" value="focus"/><span><b>⊙</b> 专注</span></label><label><input type="radio" name="q7" value="inspire"/><span><b>✦</b> 灵感</span></label></div></section>
<section class="question-card"><p class="question-kicker">ONE LAST THING</p><h1>如果今天只能选一杯，<br/>你会选？</h1><div class="options"><label><input type="radio" name="q8" value="espresso"/><span><b>●</b> 浓缩 Espresso</span></label><label><input type="radio" name="q8" value="latte"/><span><b>☁</b> 拿铁 Latte</span></label><label><input type="radio" name="q8" value="filter"/><span><b>◒</b> 手冲 Filter</span></label><label><input type="radio" name="q8" value="coldbrew"/><span><b>◇</b> 冷萃 Cold Brew</span></label></div></section>
<div class="quiz-actions"><button type="button" id="prevBtn" class="secondary-btn">← 上一题</button><button type="button" id="nextBtn" class="primary-btn">下一题 <span>→</span></button></div></form></main><script src="quiz.js"></script></body></html>
